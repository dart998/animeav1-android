name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=AnimeAV1-v$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/animeav1-release.jks"

      - name: Test and build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/animeav1-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease

      - name: Prepare versioned APK
        run: cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk }}"

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "${{ steps.version.outputs.apk }}"

      - name: Prepare release notes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: bash scripts/release-notes.sh "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: animeav1-v${{ steps.version.outputs.version }}-apk
          path: ${{ steps.version.outputs.apk }}

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.version.outputs.apk }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "AnimeAV1 $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release edit "$TAG" --title "AnimeAV1 $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" "$APK" --clobber
